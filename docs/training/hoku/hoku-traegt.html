<title>Hoku trägt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: Abschluss eines Trainings. Hoku steht mittig auf dem Boden, die Scheiben
   fallen Satz fuer Satz auf seine Schultern. Zahl oben, Satz und Steuerung unten.
   Farben aus der App: Tiefschwarz, Hokus Cyan/Violett/Pink, Orange nur fuer die Steigerung. */
:root{
  --bg:#02030a;
  --sheet:#080a16;
  --ink:#eef1fa;
  --dim:#8e99b5;
  --faint:#5d6680;
  --cyan:#6ee6ff;
  --cyan-soft:rgba(110,230,255,.12);
  --up:#f97316;
  --up-2:#fdba74;
  --line:rgba(160,200,255,.12);
  --chip:rgba(255,255,255,.05);
  --font-display:'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  --font-body:Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
.app{position:relative;height:100%;max-width:440px;margin:0 auto;overflow:hidden;background:var(--bg)}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.03em}

.hud{position:absolute;left:0;right:0;top:0;z-index:2;pointer-events:none;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 0;
  display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.hud-top{display:flex;align-items:center;gap:8px}
.eyebrow{font-size:11px;font-weight:600;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
.tag{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);background:var(--cyan-soft);border:1px solid rgba(110,230,255,.35);border-radius:999px;padding:2px 8px}
.total{display:flex;align-items:baseline;gap:6px}
.total .num{font-family:var(--font-display);font-weight:700;font-size:54px;line-height:1;color:#f4f8ff;text-shadow:0 0 34px rgba(110,230,255,.22)}
.total .unit{font-size:18px;font-weight:700;color:var(--dim)}
.meter{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--faint);width:100%;max-width:310px}
.meter.up{color:var(--up-2)}
.bar{flex:1;height:3px;border-radius:2px;background:rgba(160,200,255,.1);overflow:hidden;display:flex}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,rgba(110,230,255,.5),var(--cyan))}
.bar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--up-2),var(--up))}
.share{position:absolute;top:8px;right:max(10px, env(safe-area-inset-right, 0px));pointer-events:auto;width:44px;height:44px;border-radius:12px;
  display:inline-flex;align-items:center;justify-content:center;color:#c7d6f0;background:var(--chip);border:1px solid var(--line)}

.tray{position:absolute;left:0;right:0;bottom:0;z-index:2;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:26px max(14px, env(safe-area-inset-bottom, 0px));
  background:linear-gradient(180deg, rgba(2,3,10,0) 0%, rgba(2,3,10,.9) 22%, var(--bg) 50%);
  display:flex;flex-direction:column;gap:10px}
.now{display:flex;flex-direction:column;gap:3px;min-height:44px}
.now-title{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--ink);text-wrap:balance}
.now-sub{font-size:13px;color:var(--dim)}
.now-sub em{font-style:normal;color:var(--up-2);font-weight:700}
.progress{display:flex;gap:3px}
.progress span{flex:1;height:3px;border-radius:2px;background:rgba(160,200,255,.1)}
.progress span.done{background:rgba(110,230,255,.75)}
.progress span.up{background:var(--up)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{margin:0;font-size:12px;color:var(--faint);min-height:1.4em}

button{font-family:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;border:none;background:transparent;color:inherit;padding:0;
  transition:transform 140ms cubic-bezier(.23,1,.32,1)}
button:active{transform:scale(.96)}
button:focus-visible,label:focus-within{outline:2px solid var(--cyan);outline-offset:2px}
.btn{min-height:44px;padding:0 16px;white-space:nowrap;border-radius:14px;background:var(--chip);border:1px solid var(--line);color:#dfe7f6;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#001018;flex:1;box-shadow:0 0 24px rgba(110,230,255,.22)}
.btn.icon{width:44px;padding:0}
.chip{min-height:36px;padding:0 13px;border-radius:999px;background:var(--chip);border:1px solid var(--line);color:#c7d6f0;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:rgba(110,230,255,.55);background:var(--cyan-soft);color:var(--cyan)}
.sound .on-i{display:none}.sound[aria-pressed="true"] .on-i{display:inline}.sound[aria-pressed="true"] .off-i{display:none}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:13px;z-index:1}

/* Teilen-Blatt */
.scrim{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.62);opacity:0;transition:opacity 220ms cubic-bezier(.23,1,.32,1)}
.scrim.open{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;max-height:95%;overflow:auto;background:var(--sheet);border-top:1px solid rgba(110,230,255,.25);border-radius:22px 22px 0 0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:8px max(16px, env(safe-area-inset-bottom, 0px));
  display:flex;flex-direction:column;gap:12px;transform:translateY(100%);transition:transform 320ms cubic-bezier(.23,1,.32,1)}
.sheet.open{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);align-self:center}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet h2{margin:0;font-family:var(--font-display);font-size:19px;font-weight:700}
.icon-btn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--dim);background:var(--chip)}
.modes{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.preview{border-radius:14px;overflow:hidden;background:#05060c;display:flex;align-items:center;justify-content:center;min-height:240px;border:1px solid var(--line)}
.preview.checker{background:repeating-conic-gradient(#1a1d29 0 25%, #10121b 0 50%) 0 0/20px 20px}
.preview img{display:block;max-width:100%;max-height:44vh;object-fit:contain}
.preview p{margin:0;padding:24px;font-size:13px;color:var(--dim);text-align:center;max-width:30ch;line-height:1.45}
.mode-note{margin:0;font-size:12px;color:var(--dim);line-height:1.45}
.cta{flex:1;min-height:50px;border-radius:14px;background:var(--cyan);color:#001018;font-size:15px;font-weight:800}
.cta[disabled]{opacity:.45;cursor:default}
.hint{margin:0;font-size:12px;color:var(--faint);text-align:center;min-height:1.4em}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){
  .sheet{transform:none;opacity:0;transition:opacity 180ms ease}
  .sheet.open{opacity:1}
}
</style>

<div class="app" id="app">
  <canvas id="stage" role="img" aria-label="Hoku, die Punktkugel, trägt die Hantelscheiben des Trainings auf den Schultern. Je schwerer, desto flacher wird er und desto größer werden seine Arme."></canvas>
  <div class="loading" id="loading">Hoku macht sich bereit …</div>

  <header class="hud" id="hud">
    <div class="hud-top"><span class="eyebrow">Push A · Abschluss</span><span class="tag">Beispiel</span></div>
    <div class="total"><span class="num" id="kg">0</span><span class="unit">kg</span></div>
    <div class="meter" id="meter"><div class="bar"><i id="barBase"></i><b id="barUp"></b></div><span class="num" id="pct">Letztes Mal 6.975 kg</span></div>
    <button type="button" class="share" id="shareBtn" aria-label="Bild teilen">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="M7 8l5-5 5 5"></path><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg>
    </button>
  </header>

  <div class="tray" id="tray">
    <div class="now">
      <div class="now-title" id="nowTitle">Hoku wartet</div>
      <div class="now-sub num" id="nowSub">16 Sätze aus 5 Übungen landen auf seinen Schultern.</div>
    </div>
    <div class="progress" id="progress" aria-hidden="true"></div>
    <div class="row" id="ctlPlay">
      <button type="button" class="btn primary" id="nextBtn">Nächster Satz</button>
      <button type="button" class="btn" id="skipBtn">Überspringen</button>
      <button type="button" class="btn icon sound" id="snd" aria-pressed="false" aria-label="Ton">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"></path><path class="on-i" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"></path><path class="off-i" d="M16 9l5 6M21 9l-5 6"></path></svg>
      </button>
    </div>
    <div class="row" id="ctlDone" hidden>
      <button type="button" class="btn icon" id="replayBtn" aria-label="Nochmal abspielen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v5h5"></path></svg>
      </button>
      <button type="button" class="btn primary" id="shareBtn2">Bild teilen</button>
    </div>
    <p class="status" id="status" aria-live="polite">Tippe auf Hoku, um den nächsten Satz sofort fallen zu lassen.</p>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle">Bild teilen</h2>
      <button type="button" class="icon-btn" id="sheetClose" aria-label="Schließen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <div class="modes" id="modes" role="group" aria-label="Variante">
      <button type="button" class="chip" data-mode="card" aria-pressed="true">Karte</button>
      <button type="button" class="chip" data-mode="sticker" aria-pressed="false">Sticker</button>
      <button type="button" class="chip" data-mode="photo" aria-pressed="false">Auf Foto</button>
    </div>
    <p class="mode-note" id="modeNote"></p>
    <div class="preview" id="preview"><img id="previewImg" alt="Vorschau des Bildes zum Teilen"><p id="previewEmpty" hidden>Wähle ein Foto vom Training. Hoku mit dem Turm kommt unten links darauf.</p></div>
    <div class="row" id="photoRow" hidden><label class="chip">Foto wählen<input type="file" accept="image/*" id="photoInput" class="vh"></label></div>
    <div class="row"><button type="button" class="cta" id="saveBtn">Bild speichern</button></div>
    <p class="hint" id="saveHint" aria-live="polite"></p>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(() => {
  const M = window.Matter
  const $ = id => document.getElementById(id)
  if (!M) { $('loading').textContent = 'Die Physik-Bibliothek ließ sich nicht laden.'; return }

  const app = $('app'), cv = $('stage'), ctx = cv.getContext('2d')
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
  const deNum = n => n.toLocaleString('de-DE')
  const TAU = Math.PI * 2
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v))
  function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c }

  // ---------- Beispieltraining ----------
  const WORKOUT = {
    name: 'Push A',
    last: 6975,
    exercises: [
      { name: 'Bankdrücken', sets: [[60, 10], [80, 8], [80, 8], [82.5, 6]] },
      { name: 'Schrägbank Kurzhantel', sets: [[60, 10], [60, 10], [60, 9]] },
      { name: 'Schulterdrücken', sets: [[50, 10], [50, 10], [50, 8]] },
      { name: 'Seitheben', sets: [[20, 15], [20, 15], [20, 12]] },
      { name: 'Trizepsdrücken Kabel', sets: [[35, 12], [35, 12], [35, 12]] },
    ],
  }
  const exVol = WORKOUT.exercises.map(e => e.sets.reduce((s, [w, r]) => s + w * r, 0))
  const PLAN_TOTAL = exVol.reduce((a, b) => a + b, 0)
  const SET_COUNT = WORKOUT.exercises.reduce((a, e) => a + e.sets.length, 0)
  const SEED = 20261029

  // ---------- Hoku: Werte aus der App (dotEngine.ts, DotLogo.tsx) ----------
  const CYAN = [110, 230, 255], VIOLET = [175, 135, 255], PINK = [255, 120, 200]
  const PUNKTE = 460           // Punkte seines Koerpers
  const ARM_PUNKTE = 220       // je Arm, wachsen aus der Schulter heraus
  const R0 = 120               // Ruheradius in Welteinheiten (eine 20-kg-Scheibe ist 160 breit)
  const LOAD_KG = 3200         // bei diesem Gewicht ist er zu zwei Dritteln verformt
  const mischen = (a, b, m) => a.map((v, i) => v + (b[i] - v) * m)
  function farbe(x, y) {       // x, y in -1..1 (y nach unten positiv), wie im Logo
    let c = mischen(CYAN, VIOLET, clamp((x - y) * 0.32 + 0.5 - 0.035, 0, 1))
    if (y > 0.55) c = mischen(c, PINK, Math.min(1, (y - 0.55) * 1.4))
    return c
  }
  // Weiche Punkte als Sprites in Farbstufen, additiv gezeichnet
  const SPRITE_N = 10, SPRITES = []
  function buildSprites() {
    for (let i = 0; i < SPRITE_N; i++) {
      // Stufe i: 0..6 cyan->violett (x-y von -1..1), 7..9 pink-Anteil
      const c = i < 7 ? mischen(CYAN, VIOLET, i / 6) : mischen(mischen(CYAN, VIOLET, 0.55), PINK, (i - 6) / 3)
      const s = canvas(32, 32), g = s.getContext('2d')
      const col = `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`
      const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16)
      gr.addColorStop(0, col); gr.addColorStop(0.55, col); gr.addColorStop(1, 'rgba(0,0,0,0)')
      g.fillStyle = gr; g.beginPath(); g.arc(16, 16, 16, 0, TAU); g.fill()
      SPRITES.push(s)
    }
  }
  const spriteFor = (x, y) => y > 0.55 ? 7 + Math.min(2, Math.round((y - 0.55) * 1.4 * 2)) : Math.round(clamp((x - y) * 0.32 + 0.5, 0, 1) * 6)
  // Kugelpunkte (Fibonacci) wie im Logo
  const SPHERE = []
  {
    const ga = Math.PI * (3 - Math.sqrt(5))
    for (let i = 0; i < PUNKTE; i++) {
      const y = 1 - (2 * (i + 0.5)) / PUNKTE, rr = Math.sqrt(1 - y * y), th = ga * i
      SPHERE.push({ x: Math.cos(th) * rr, y, z: Math.sin(th) * rr, j: Math.random() })
    }
  }
  // Armpunkte: Lage entlang (u) und quer (v) des Arms, fester Zufall
  const ARM = [[], []]
  {
    let s = SEED
    const rnd = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296 }
    for (const side of ARM) for (let i = 0; i < ARM_PUNKTE; i++) side.push({ u: rnd(), v: rnd() * 2 - 1, w: rnd(), p: rnd() * TAU })
  }
  const hoku = { L: 0, Lt: 0, squash: 0, squashV: 0, joy: 0, spin: 0, trem: 0, rx: R0, ry: R0, armLen: 0, armT: 0, gap: 0 }
  // Form aus der Last: breiter und flacher, Arme laenger und dicker, Haende halten den Turm
  function hokuShape(L, stackH) {
    const rx = R0 * (1 + 2.3 * L), ry = R0 * (1 - 0.56 * L) * (1 - 0.18 * hoku.squash)
    const armT = 16 + 110 * L
    const gap = Math.min(880, rx * 2.05)                // Arme sitzen am Rand seiner Schultern; breiter Griff = breiterer Turm
    const armLen = 2 * ry + stackH + 200 + 60 * L                        // vom Boden bis zur Hand, immer ueber der Turmspitze
    return { rx, ry, armT, gap, armLen }
  }

  // ---------- Welt ----------
  const KINDS = {
    20:   { kg: 20,   w: 160, h: 22 },
    15:   { kg: 15,   w: 144, h: 20 },
    10:   { kg: 10,   w: 127, h: 18 },
    7.5:  { kg: 7.5,  w: 110, h: 16 },
    5:    { kg: 5,    w: 94,  h: 15 },
    2.5:  { kg: 2.5,  w: 78,  h: 14 },
    1.25: { kg: 1.25, w: 63,  h: 14 },
  }
  const ORDER = [20, 15, 10, 7.5, 5, 2.5, 1.25]
  const MAXSTEP = 9, SUBMS = 1000 / 240
  const NCOL = 40
  function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } }
  let rnd = mulberry32(SEED)

  let engine, world, live = [], total = 0, count = 0, simT = 0, steps = 0
  let statics = []
  const ID0 = 1000
  function buildWorld() {
    M.Common._nextId = ID0
    engine = M.Engine.create({ enableSleeping: true, positionIterations: 10, velocityIterations: 8 })
    engine.gravity.y = 2.4
    world = engine.world
    M.Composite.add(world, M.Bodies.rectangle(0, 200, 20000, 400, { isStatic: true, friction: 0.9 }))
    statics = []
    M.Events.on(engine, 'afterUpdate', clampSpeed)
    M.Events.on(engine, 'collisionStart', onCollide)
    live = []; total = 0; count = 0; simT = 0; steps = 0
    rnd = mulberry32(SEED)
    Object.assign(hoku, { L: 0, Lt: 0, squash: 0, squashV: 0, joy: 0, trem: 0, rx: R0, ry: R0, armLen: 0, armT: 0, gap: 0 })
    syncBody(true)
  }
  // Hokus Oberseite als Saeulen, Arme als Rechtecke vom Boden bis zur Hand, Haende als Kreise.
  // y nach oben negativ, Boden y = 0; der Koerper reicht von 0 bis -2 ry. Feste Koerper werden
  // bei Formaenderung neu angelegt (Umschreiben der Ecken bringt Matter aus dem Tritt).
  const topAt = x => { const q = x / hoku.rx; return Math.abs(q) >= 1 ? 0 : -hoku.ry - hoku.ry * Math.sqrt(1 - q * q) }
  let lastSync = null
  function syncBody(force) {
    const key = [Math.round(hoku.rx / 4), Math.round(hoku.ry / 4), Math.round(hoku.armLen / 14), Math.round(hoku.armT / 4)].join()
    if (!force && key === lastSync) return
    lastSync = key
    for (const b of statics) M.Composite.remove(world, b)
    statics = []
    const cw = (2 * hoku.rx) / NCOL
    for (let i = 0; i < NCOL; i++) {
      const x = -hoku.rx + (i + 0.5) * cw
      const top = Math.min(topAt(x - cw * 0.4), topAt(x + cw * 0.4), topAt(x))
      const h = Math.max(6, -top)
      statics.push(M.Bodies.rectangle(x, top + h / 2, cw + 1, h, { isStatic: true, friction: 0.9 }))
    }
    const sx = hoku.gap / 2, len = hoku.armLen, t = hoku.armT, hr = Math.max(10, t * 0.62)
    for (const sgn of [-1, 1]) {
      statics.push(M.Bodies.rectangle(sgn * (sx + t / 2), -len / 2, t, len, { isStatic: true, friction: 0.5 }))
      statics.push(M.Bodies.circle(sgn * (sx + hr * 0.3), -len, hr, { isStatic: true, friction: 0.6 }))
    }
    M.Composite.add(world, statics)
  }

  // ---------- Physik ----------
  function clampSpeed() {
    for (const b of live) {
      const dx = b.position.x - b.positionPrev.x, dy = b.position.y - b.positionPrev.y
      const d = Math.hypot(dx, dy)
      if (d > MAXSTEP) { const k = MAXSTEP / d; b.positionPrev.x = b.position.x - dx * k; b.positionPrev.y = b.position.y - dy * k }
    }
  }
  function onCollide(e) {
    for (const p of e.pairs) {
      for (const [a, o] of [[p.bodyA, p.bodyB], [p.bodyB, p.bodyA]]) {
        const t = a.plugin && a.plugin.tyd
        if (!t || !t.fresh) continue
        const ot = o.plugin && o.plugin.tyd
        if (ot && ot.fresh) continue
        t.fresh = false
        const sp = Math.hypot(a.position.x - a.positionPrev.x, a.position.y - a.positionPrev.y)
        if (sp > 2.2) {
          const s = p.collision && p.collision.supports && p.collision.supports[0]
          impact(s ? s.x : a.position.x, s ? s.y : a.position.y + KINDS[t.kg].h / 2, t.kg, sp, t.chalk)

  // ---------- Ablauf ----------
  const PATTERN = [20, 20, 20, 15, 20, 10, 20, 5, 20, 2.5, 20, 1.25, 20, 7.5, 10, 20]
  function plan(kg) {
    const out = []
    let rest = kg, i = 0
    while (rest >= 20) { const p = PATTERN[i++ % PATTERN.length]; out.push(p); rest -= p }
    for (const p of ORDER) while (rest >= p - 1e-9) { out.push(p); rest -= p }
    return out
  }
  let queue = [], playing = false, wait = 0, gap = 6, boost = false, skipping = false, setsDone = 0
  function buildQueue() {
    const q = []
    let cum = 0, n = 0
    WORKOUT.exercises.forEach((ex, ei) => ex.sets.forEach(([w, r], si) => {
      q.push({ start: { ei, si, w, r, n: n++ } })
      for (const kg of plan(w * r)) { cum += kg; q.push({ kg, ex: ei, chalk: cum > WORKOUT.last + 1e-9 }) }

  }
  function schedStep() {
    if (!playing) return

    while (queue.length) {
      const it = queue[0]

      if (it.pause) { queue.shift(); wait = skipping ? 0 : it.pause; return }
      queue.shift(); dropPlate(it)

    playing = false
    onDone()
  }
  function onSetStart(s) {

    $('nowSub').innerHTML = `${deNum(s.w)} kg × ${s.r} = <em>${deNum(s.w * s.r)} kg</em>`

  }
  function nextSet() {

  }
  function renderProgress() {
    const el = $('progress')

    WORKOUT.exercises.forEach(ex => ex.sets.forEach(([w, r]) => { cum += w * r; el.children[k].className = k < setsDone ? (cum > WORKOUT.last ? 'up' : 'done') : ''; k++ }))

  function onDone() { $('ctlPlay').hidden = true; $('ctlDone').hidden = false; summary() }

    cam.snap = true
  }

  // ---------- Scheiben-Grafik (Eisen, wie im Silo) ----------
  const SPR = 1.6

  // Szene: Hoku samt Armen und Turm muss ins Bild
  function sceneBox() {

  }

  // ---------- Kreide + Ton ----------
  const dust = []
  let lastDust = 0, lastSound = 0
  function impact(wx, wy, kg, sp, chalk) {
    const now = performance.now()
    if (!reduce && now - lastDust > 60 && dust.length < 320) {
      lastDust = now
      const k = clamp(cam.k / 0.5, 0.35, 1), size = 0.5 + kg / 40, more = chalk ? 1.6 : 1
      const n = Math.round((6 + 8 * kg / 20) * more)
      for (let i = 0; i < n; i++) {
        const dir = Math.random() < 0.5 ? -1 : 1
        dust.push({ wx, wy, dx: 0, dy: 0, vx: dir * (0.5 + Math.random() * 2.2) * k * (1 + size), vy: -(Math.random() * 1) * k, life: 0, max: 34 + Math.random() * 24, r: (0.8 + Math.random() * 1.6) * k * (0.8 + size * 0.5), cloud: false })
      }
      dust.push({ wx, wy, dx: 0, dy: -3 * k, vx: 0, vy: -0.12, life: 0, max: 42, r: 14 * k * (0.8 + size) * more, cloud: true, a: chalk ? 0.28 : 0.14 })
    }

  }
  let actx = null, noise = null, soundOn = false
  function ensureAudio() {
    if (actx) return

      const d = noise.getChannelData(0)
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3)
    } catch (_) { actx = null }
  }
  function clank(v, kg) {

    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500 - 700 * heavy; bp.Q.value = 3
    const g = actx.createGain(); g.gain.setValueAtTime(0.14 * v, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.22)

  // ---------- Zeichnen ----------
  let sel = null
  // Hoku: Koerper als zerfliessende Kugel, Arme aus Punkten, additiv mit Schein
  function drawHoku(g, k, tx, ty, opts) {
    const L = hoku.L, trem = (0.012 + 0.05 * L) * (1 - 0.5 * hoku.joy)
    const bright = (0.85 + 0.35 * hoku.joy) * (opts && opts.bright || 1)
    const cy = -hoku.ry, rx = hoku.rx, ry = hoku.ry
    const cs = Math.cos(hoku.spin), sn = Math.sin(hoku.spin)
    g.setTransform(1, 0, 0, 1, 0, 0)
    g.globalCompositeOperation = 'lighter'
    // Schein unter ihm
    const gx = tx, gy = ty + cy * k
    const glow = g.createRadialGradient(gx, gy, 0, gx, gy, Math.max(rx, ry) * k * 1.6)
    glow.addColorStop(0, `rgba(110,200,255,${0.16 * bright})`); glow.addColorStop(0.5, `rgba(150,130,255,${0.06 * bright})`); glow.addColorStop(1, 'rgba(0,0,0,0)')
    g.fillStyle = glow; g.fillRect(gx - rx * k * 2, gy - ry * k * 2.2, rx * k * 4, ry * k * 4.4)
    // Koerper
    const ps = Math.max(2.2 * (opts && opts.unit || 1), 5.2 * k * (1 - 0.25 * L))   // Punktgroesse in Bildpunkten
    for (const p of SPHERE) {
      const x3 = p.x * cs - p.z * sn, z3 = p.x * sn + p.z * cs, y3 = p.y
      const f = (z3 + 1) / 2
      // Zerfliessen: breiter, flacher, unten platt (Pfannkuchen); Zittern mit der Last
      const th = Math.atan2(y3, x3)
      const wob = 1 + trem * Math.sin(3 * th + hoku.trem * 2.1 + p.j * 6) + 0.5 * trem * Math.sin(5 * th - hoku.trem * 1.7)
      let X = x3 * rx * wob, Y = y3 * ry * wob
      if (Y > 0) Y = Y * (1 - 0.35 * L)              // Unterseite liegt auf
      const sx = tx + X * k, sy = ty + cy * k + Y * k
      const sz = ps * (0.55 + 0.7 * f) * (0.9 + 0.3 * hoku.joy)
      g.globalAlpha = (0.15 + 0.85 * f * f) * bright
      g.drawImage(SPRITES[spriteFor(x3, y3)], sx - sz, sy - sz, sz * 2, sz * 2)
    }
    // Arme: aus der Schulter heraus, mit Ellbogen nach aussen, dicker und laenger mit der Last;
    // die Haende halten den Turm. Gezeichnet als leuchtendes Glied plus Punkte (sichtbar bei jedem Zoom).
    const armFill = clamp((hoku.armT - 16) / 30, 0, 1)
    if (armFill > 0.02) {
      const u = (opts && opts.unit) || 1
      const sy = -ry * 1.15, len = hoku.armLen, t = hoku.armT
      for (const [side, sgn] of [[ARM[0], -1], [ARM[1], 1]]) {
        const x0 = sgn * rx * 0.72, xTop = sgn * (hoku.gap / 2 + t * 0.55)
        const elbowX = sgn * (hoku.gap / 2 + t * 1.2 + 40 * L), elbowY = sy - (len - (-sy)) * 0.45
        const P = q => { const a = 1 - q; return { x: a * a * x0 + 2 * a * q * elbowX + q * q * xTop, y: a * a * sy + 2 * a * q * elbowY + q * q * (-len) } }
        const thick = q => t * (0.55 + 0.75 * Math.sin(Math.PI * q) * (0.35 + 0.65 * L)) * (q > 0.93 ? 1.45 : 1)
        // Glied
        const grad = g.createLinearGradient(tx + x0 * k, ty + sy * k, tx + xTop * k, ty - len * k)
        grad.addColorStop(0, `rgba(110,230,255,${0.22 * armFill * bright})`); grad.addColorStop(1, `rgba(175,135,255,${0.26 * armFill * bright})`)
        g.strokeStyle = grad; g.lineCap = 'round'; g.lineJoin = 'round'
        const segs = 14
        for (let i = 0; i < segs; i++) {
          const q0 = i / segs, q1 = (i + 1) / segs, a = P(q0), c = P(q1)
          g.lineWidth = Math.max(5 * u, thick((q0 + q1) / 2) * k)
          g.beginPath(); g.moveTo(tx + a.x * k, ty + a.y * k); g.lineTo(tx + c.x * k, ty + c.y * k); g.stroke()
        }
        // Hand als Schein
        const H = P(1), hr = Math.max(8 * u, t * 0.9 * k)
        const hg = g.createRadialGradient(tx + H.x * k, ty + H.y * k, 0, tx + H.x * k, ty + H.y * k, hr * 1.6)
        hg.addColorStop(0, `rgba(190,170,255,${0.5 * armFill * bright})`); hg.addColorStop(1, 'rgba(0,0,0,0)')
        g.fillStyle = hg; g.fillRect(tx + H.x * k - hr * 2, ty + H.y * k - hr * 2, hr * 4, hr * 4)
        // Punkte auf dem Glied, Dichte nach Bildlaenge

          const X = c.x + nx / nl * q.v * th * 0.5 * wob, Y = c.y + ny / nl * q.v * th * 0.5 * wob

          g.globalAlpha = (0.25 + 0.75 * depth * depth) * bright * armFill
          g.drawImage(SPRITES[spriteFor(sgn * 0.6, -0.3 + 1.0 * qq)], tx + X * k - sz, ty + Y * k - sz, sz * 2, sz * 2)

  function draw() {

    for (let i = dust.length - 1; i >= 0; i--) {
      const p = dust[i]
      p.life++; p.dx += p.vx; p.dy += p.vy; p.vx *= p.cloud ? 0.97 : 0.93; p.vy = p.vy * 0.95 + (p.cloud ? -0.01 : 0.02)
      const q = p.life / p.max
      if (q >= 1) { dust.splice(i, 1); continue }
      const x = W / 2 + p.wx * cam.k + p.dx, y = floorY + p.wy * cam.k + p.dy
      if (p.cloud) {
        const r = p.r * (0.6 + 1.8 * (1 - Math.pow(1 - q, 3)))
        const gr = ctx.createRadialGradient(x, y, 0, x, y, r)
        gr.addColorStop(0, `rgba(239,233,221,${p.a * (1 - q)})`); gr.addColorStop(1, 'rgba(239,233,221,0)')
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill()
      } else { ctx.fillStyle = `rgba(239,233,221,${0.9 * (1 - q)})`; ctx.beginPath(); ctx.arc(x, y, p.r * (0.6 + q), 0, TAU); ctx.fill() }
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0)
    const hb = Math.round((layout.hudB - 14) * dpr), band = Math.round(30 * dpr)
    ctx.drawImage(bg, 0, 0, bg.width, Math.max(1, hb - band), 0, 0, bg.width, Math.max(1, hb - band))
    for (let i = 0; i < 12; i++) { const y0 = hb - band + Math.round(i * band / 12), h = Math.ceil(band / 12); ctx.globalAlpha = 1 - i / 12; ctx.drawImage(bg, 0, y0, bg.width, h, 0, y0, bg.width, h) }
    ctx.globalAlpha = 1
    ctx.drawImage(vig, 0, 0)
  }

  // ---------- HUD ----------
  let shown = 0, noticeUntil = 0
  function notice(msg, ms) { $('status').textContent = msg; noticeUntil = performance.now() + (ms || 2200) }
  function hud(force) {
    const d = total - shown
    shown = force || reduce || Math.abs(d) < 0.5 ? total : shown + d * 0.2
    $('kg').textContent = deNum(Math.round(shown))
    const last = WORKOUT.last, scale = Math.max(last, PLAN_TOTAL)
    $('barBase').style.width = (Math.min(shown, last) / scale * 100).toFixed(2) + '%'
    $('barUp').style.width = (Math.max(0, shown - last) / scale * 100).toFixed(2) + '%'
    const up = shown > last
    $('meter').classList.toggle('up', up)
    $('pct').textContent = up ? `+${deNum(Math.round(shown - last))} kg zum letzten Mal` : `Letztes Mal ${deNum(last)} kg`
  }

  // ---------- Bedienung ----------
  function selectEx(ex) {
    sel = sel === ex ? null : ex
    if (sel == null) { summary(); return }
    const e = WORKOUT.exercises[sel]
    $('nowTitle').textContent = e.name
    $('nowSub').textContent = `${deNum(exVol[sel])} kg · ${Math.round(exVol[sel] / PLAN_TOTAL * 100)} %  ·  ` + e.sets.map(([w, r]) => `${deNum(w)} × ${r}`).join(' · ')
    $('status').textContent = 'Nochmal antippen, um alle Übungen zu zeigen.'
  }
  function hitPlate(wx, wy) {
    let hit = null, best = 22 / cam.k
    for (const b of live) {
      const t = b.plugin.tyd, K = KINDS[t.kg], dx = wx - b.position.x, dy = wy - b.position.y, c = Math.cos(b.angle), s = Math.sin(b.angle)
      const lx = dx * c + dy * s, ly = -dx * s + dy * c
      const d = Math.max(0, Math.abs(lx) - K.w / 2) + Math.max(0, Math.abs(ly) - K.h / 2)
      if (d <= best) { best = d; hit = t.ex }
    }
    return hit
  }
  cv.addEventListener('click', e => {
    const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top
    if (playing) { nextSet(); return }
    const hit = hitPlate((px - layout.W / 2) / cam.k, (py - layout.floorY) / cam.k)
    if (hit != null) selectEx(hit); else if (sel != null) selectEx(sel)
  })
  $('nextBtn').addEventListener('click', nextSet)
  $('skipBtn').addEventListener('click', () => { skipping = true; wait = 0 })
  $('replayBtn').addEventListener('click', startReplay)
  $('snd').addEventListener('click', e => {
    soundOn = !soundOn
    if (soundOn) { ensureAudio(); try { actx && actx.resume() } catch (_) {} }
    e.currentTarget.setAttribute('aria-pressed', String(soundOn))
  })
  window.addEventListener('resize', resize)

  // ---------- Teilen ----------
  const today = new Date()
  const dateText = today.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' })
  const isoDate = today.toISOString().slice(0, 10)
  const MODES = {
    card: { note: 'Dunkle Karte im 4:5-Format für Feed und Story.', file: 'karte', ext: 'png' },
    sticker: { note: 'Durchsichtig: Hoku mit dem Turm zum Drüberlegen in der Story.', file: 'sticker', ext: 'png' },
    photo: { note: 'Dein Foto mit Hoku und dem Turm unten links.', file: 'foto', ext: 'jpg' },
  }
  function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})` }
  function text(g, str, x, y, font, color, align, ls) { g.font = font; g.fillStyle = color; g.textAlign = align || 'left'; g.textBaseline = 'alphabetic'; spacing(g, ls || 0); g.fillText(str, x, y) }
  function headBlock(g, x, top, ink, glow) {
    const up = total - WORKOUT.last
    if (glow) { g.shadowColor = glow; g.shadowBlur = 18 }
    text(g, `${WORKOUT.name.toUpperCase()} · ${dateText}`, x, top + 40, '600 28px Inter, sans-serif', rgba(ink, 0.7), 'left', 5)
    const num = deNum(Math.round(total))
    g.font = '700 150px "Space Grotesk", Inter, sans-serif'; spacing(g, -4)
    const nw = g.measureText(num).width
    text(g, num, x - 4, top + 186, '700 150px "Space Grotesk", Inter, sans-serif', ink, 'left', -4)
    text(g, 'kg', x + nw + 10, top + 186, '600 52px Inter, sans-serif', rgba(ink, 0.6), 'left')
    text(g, `${WORKOUT.exercises.length} Übungen · ${SET_COUNT} Sätze · ${deNum(count)} Scheiben`, x, top + 240, '500 30px Inter, sans-serif', rgba(ink, 0.6), 'left')
    if (up > 0) text(g, `+${deNum(up)} kg mehr als letztes Mal`, x, top + 284, '700 30px Inter, sans-serif', '#fdba74', 'left')
    g.shadowBlur = 0; g.shadowColor = 'transparent'
  }
  function footer(g, W, H, ink, rule) {
    if (rule) { g.fillStyle = rgba(ink, 0.15); g.fillRect(72, H - 92, W - 144, 1.5) }
    text(g, 'TrackYourDose', 72, H - 44, '700 30px "Space Grotesk", Inter, sans-serif', rgba(ink, 0.9), 'left', 2)
    text(g, 'Hoku trägt', W - 72, H - 44, '500 26px Inter, sans-serif', rgba(ink, 0.5), 'right', 1)
  }
  function scene(g, rx, ry, rw, rh) {
    const k = Math.min(0.9, fitK(rw, rh))
    drawScene(g, k, rx + rw / 2, ry + rh - 8, { unit: 1.9 })
  }
  function renderCard() {
    const W = 1080, H = 1350, c = canvas(W, H), g = c.getContext('2d')
    paintStage(g, W, H); headBlock(g, 72, 60, '#eef3fc'); scene(g, 56, 360, 968, 850); paintVignette(g, W, H); footer(g, W, H, '#eef3fc', true)
    return c
  }
  function renderSticker() {
    const W = 1080, H = 1350, c = canvas(W, H), g = c.getContext('2d')
    headBlock(g, 72, 60, '#ffffff', 'rgba(0,0,0,.5)'); scene(g, 56, 360, 968, 880); footer(g, W, H, '#ffffff', false)
    return c
  }
  function renderOnPhoto(img) {
    const W = 1080, H = 1350, c = canvas(W, H), g = c.getContext('2d')
    const sc = Math.max(W / img.width, H / img.height), iw = img.width * sc, ih = img.height * sc
    g.drawImage(img, (W - iw) / 2, (H - ih) / 2, iw, ih)
    const gr = g.createLinearGradient(0, H * 0.45, 0, H); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.55)')
    g.fillStyle = gr; g.fillRect(0, H * 0.45, W, H * 0.55)
    const st = renderSticker(), sw = 560, sh = sw * st.height / st.width
    g.drawImage(st, 20, H - sh - 10, sw, sh)
    return c
  }
  let mode = 'card', photo = null, blob = null, blobUrl = null, dl = null, dlChecked = false, renderToken = 0
  const sheet = $('sheet'), scrim = $('scrim'), img = $('previewImg'), empty = $('previewEmpty'), saveBtn = $('saveBtn'), hint = $('saveHint')
  ;(async () => { try { if (window.claude && typeof window.claude.use === 'function') dl = await window.claude.use('downloads') } catch (_) { dl = null } dlChecked = true; syncSave() })()
  function syncSave() { saveBtn.hidden = !dl; saveBtn.disabled = !blob; if (!dl && dlChecked) hint.textContent = blob ? 'Halte das Bild gedrückt, um es zu sichern.' : '' }
  async function renderPreview() {
    const token = ++renderToken
    $('preview').classList.toggle('checker', mode === 'sticker')
    $('photoRow').hidden = mode !== 'photo'
    $('modeNote').textContent = MODES[mode].note + (sel != null ? ` Ausgewählt: ${WORKOUT.exercises[sel].name}.` : '')
    if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null }
    blob = null
    if (mode === 'photo' && !photo) { img.hidden = true; empty.hidden = false; if (dl) hint.textContent = ''; syncSave(); return }
    const c = mode === 'card' ? renderCard() : mode === 'sticker' ? renderSticker() : renderOnPhoto(photo)
    const b = await new Promise(r => c.toBlob(r, MODES[mode].ext === 'jpg' ? 'image/jpeg' : 'image/png', 0.92))
    if (token !== renderToken) return
    blob = b; blobUrl = URL.createObjectURL(blob); img.src = blobUrl; img.hidden = false; empty.hidden = true
    if (dl) hint.textContent = ''
    syncSave()
  }
  let lastFocus = null
  function openSheet() { lastFocus = document.activeElement; scrim.hidden = false; sheet.hidden = false; requestAnimationFrame(() => { scrim.classList.add('open'); sheet.classList.add('open') }); renderPreview(); $('sheetClose').focus() }
  function closeSheet() { scrim.classList.remove('open'); sheet.classList.remove('open'); setTimeout(() => { scrim.hidden = true; sheet.hidden = true }, reduce ? 180 : 320); if (lastFocus) lastFocus.focus() }
  $('shareBtn').addEventListener('click', openSheet); $('shareBtn2').addEventListener('click', openSheet)
  $('sheetClose').addEventListener('click', closeSheet); scrim.addEventListener('click', closeSheet)
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) closeSheet() })
  for (const b of document.querySelectorAll('[data-mode]')) b.addEventListener('click', () => { mode = b.dataset.mode; for (const o of document.querySelectorAll('[data-mode]')) o.setAttribute('aria-pressed', String(o === b)); renderPreview() })
  $('photoInput').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]; if (!f) return
    const im = new Image(); im.onload = () => { photo = im; renderPreview() }; im.onerror = () => { hint.textContent = 'Dieses Bild ließ sich nicht öffnen. Versuche ein JPG oder PNG.' }; im.src = URL.createObjectURL(f)
  })
  saveBtn.addEventListener('click', async () => {
    if (!dl || !blob) return
    const m = MODES[mode], name = `tyd-hoku-${isoDate}-${m.file}.${m.ext}`
    try { await dl.save({ filename: name, data: blob }); hint.textContent = 'Gespeichert.' }
    catch (err) {
      const code = err && err.code
      if (code === 'declined') hint.textContent = 'Nicht gespeichert.'
      else if (code === 'rate_limited') hint.textContent = 'Einen Moment, dann noch einmal.'
      else if (code === 'too_large') hint.textContent = 'Das Bild ist zu groß. Wähle ein kleineres Foto.'
      else { dl = null; syncSave() }
    }
  })

  // ---------- Start ----------
  let last = 0, acc = 0
  function frame(now) {
    const dt = Math.min(50, now - last); last = now
    acc += dt
    let n = 0
    while (acc >= SUBMS && n < 12) { schedStep(); stepHoku(SUBMS); M.Engine.update(engine, SUBMS); simT += SUBMS; steps++; acc -= SUBMS; n++ }
    if (n === 12) acc = 0
    updateCamera(); draw(); hud(false)
    requestAnimationFrame(frame)
  }
  const fontsReady = document.fonts && document.fonts.load ? Promise.race([
    Promise.all([document.fonts.load('700 16px "Space Grotesk"'), document.fonts.load('700 16px Inter'), document.fonts.load('600 16px Inter'), document.fonts.load('500 16px Inter')]),
    new Promise(r => setTimeout(r, 1500)),
  ]) : Promise.resolve()
  fontsReady.catch(() => {}).then(() => {
    buildSprites()
    for (const kg of ORDER) { const k = KINDS[kg]; k.spr = [makeSprite(k, 0, false), makeSprite(k, 0, true), makeSprite(k, 1, false), makeSprite(k, 1, true), makeSprite(k, 0, false, true), makeSprite(k, 1, false, true)] }
    buildWorld(); resize(); startReplay(); updateCamera(); hud(true)
    $('loading').hidden = true
    last = performance.now()
    requestAnimationFrame(frame)
  })
})()
</script>
