<title>Volumen-Silo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: eine Handy-Buehne. Canvas fuellt alles, Zahl oben, Scheiben-Leiste unten,
   Teilen als Blatt von unten. Bewusst nur dunkel: Studiobuehne wie die Scheiben-Ansicht. */
:root{
  --bg:#030308;
  --sheet:#0b0c14;
  --ink:#eef1fa;
  --dim:#8e99b5;
  --faint:#5d6680;
  --accent:#f97316;
  --accent-ink:#1a0d02;
  --accent-soft:rgba(249,115,22,.16);
  --line:rgba(255,255,255,.1);
  --chip:rgba(255,255,255,.06);
  --font-display:'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  --font-body:Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
.app{position:relative;height:100%;max-width:440px;margin:0 auto;overflow:hidden;background:var(--bg)}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.03em}

.hud{position:absolute;left:0;right:0;top:0;z-index:2;pointer-events:none;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 0;
  display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.hud-top{display:flex;align-items:center;gap:8px}
.eyebrow{font-size:12px;font-weight:600;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fed7aa;background:var(--accent-soft);border:1px solid rgba(249,115,22,.4);border-radius:999px;padding:2px 8px}
.total{display:flex;align-items:baseline;gap:6px}
.total .num{font-family:var(--font-display);font-weight:700;font-size:54px;line-height:1;color:#fff7ed;text-shadow:0 0 40px rgba(255,200,140,.22)}
.total .unit{font-size:18px;font-weight:700;color:var(--dim)}
.meter{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--faint);width:100%;max-width:310px}
.bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#fdba74,var(--accent));border-radius:2px}
.share{position:absolute;top:8px;right:max(10px, env(safe-area-inset-right, 0px));pointer-events:auto;width:44px;height:44px;border-radius:12px;
  display:inline-flex;align-items:center;justify-content:center;color:#c7cfe2;background:var(--chip);border:1px solid var(--line)}

.tray{position:absolute;left:0;right:0;bottom:0;z-index:2;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:28px max(14px, env(safe-area-inset-bottom, 0px));
  background:linear-gradient(180deg, rgba(3,3,8,0) 0%, rgba(3,3,8,.86) 26%, var(--bg) 60%);
  display:flex;flex-direction:column;gap:10px}
.tray-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;color:var(--dim)}
.picks{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.status{margin:0;font-size:12px;color:var(--faint);min-height:1.4em}

button{font-family:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;border:none;background:transparent;color:inherit;padding:0;
  transition:transform 140ms cubic-bezier(.23,1,.32,1)}
button:active{transform:scale(.95)}
button:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.pick{min-height:56px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;padding:6px 0 4px}
.pick:hover .slab{filter:brightness(1.12)}
.slab{display:block;width:var(--w);height:var(--h);border-radius:5px;
  background:
    linear-gradient(90deg, rgba(0,0,0,.55) 0 6%, rgba(0,0,0,.2) 6% 20%, rgba(0,0,0,0) 20% 80%, rgba(0,0,0,.2) 80% 94%, rgba(0,0,0,.55) 94% 100%),
    linear-gradient(180deg, #a3a6ad 0 12%, #2e3035 12% 28%, #5d6168 28% 60%, #27292e 60% 86%, #141517 86% 100%);
  box-shadow:0 3px 0 rgba(0,0,0,.45)}
.pick .lab{font-family:var(--font-display);font-weight:700;font-size:11px;color:#c7cfe2}
.chip{min-height:38px;padding:0 14px;border-radius:999px;background:var(--chip);border:1px solid var(--line);color:#c7cfe2;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.chip.on{border-color:rgba(249,115,22,.6);background:var(--accent-soft);color:#fed7aa}
.chip.small{min-height:32px;padding:0 12px;font-size:12px}
.chip[disabled]{opacity:.4;cursor:default}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:13px;z-index:1}

/* Teilen-Blatt */
.scrim{position:absolute;inset:0;z-index:5;background:rgba(0,0,0,.6);opacity:0;transition:opacity 220ms cubic-bezier(.23,1,.32,1)}
.scrim.open{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;max-height:94%;overflow:auto;background:var(--sheet);border-top:1px solid var(--line);border-radius:22px 22px 0 0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:8px max(16px, env(safe-area-inset-bottom, 0px));
  display:flex;flex-direction:column;gap:12px;transform:translateY(100%);transition:transform 320ms cubic-bezier(.23,1,.32,1)}
.sheet.open{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);align-self:center}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet h2{margin:0;font-family:var(--font-display);font-size:19px;font-weight:700}
.icon-btn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--dim);background:var(--chip)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:12px;background:rgba(255,255,255,.05)}
.seg button{min-height:38px;border-radius:9px;font-size:13px;font-weight:700;color:var(--dim)}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.11);color:var(--ink)}
.preview{border-radius:14px;overflow:hidden;background:#05060c;display:flex;align-items:center;justify-content:center;min-height:220px;border:1px solid var(--line)}
.preview.checker{background:repeating-conic-gradient(#1b1d27 0 25%, #10121a 0 50%) 0 0/20px 20px}
.preview img{display:block;max-width:100%;max-height:44vh;object-fit:contain}
.preview p{margin:0;padding:24px;font-size:13px;color:var(--dim);text-align:center;max-width:30ch;line-height:1.45}
.row{display:flex;gap:8px;flex-wrap:wrap}
.cta{flex:1;min-height:50px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:800}
.cta[disabled]{opacity:.45;cursor:default}
.hint{margin:0;font-size:12px;color:var(--faint);text-align:center;min-height:1.4em}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){
  .sheet{transform:none;opacity:0;transition:opacity 180ms ease}
  .sheet.open{opacity:1}
}
</style>

<div class="app" id="app">
  <canvas id="stage" role="img" aria-label="Stahlsilo, in dem die Hantelscheiben aus dem Training als Haufen liegen. Das Silo wächst mit dem Gewicht."></canvas>
  <div class="loading" id="loading">Silo wird befüllt …</div>

  <header class="hud" id="hud">
    <div class="hud-top"><span class="eyebrow">Volumen dieses Trainings</span><span class="tag">Experiment</span></div>
    <div class="total"><span class="num" id="kg">0</span><span class="unit">kg</span></div>
    <div class="meter"><div class="bar"><i id="bar"></i></div><span class="num" id="pct">1-t-Silo · 0 %</span></div>
    <button type="button" class="share" id="shareBtn" aria-label="Bild teilen">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><path d="M7 8l5-5 5 5"></path><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg>
    </button>
  </header>

  <div class="tray" id="tray">
    <div class="tray-head">
      <span>Scheibe einwerfen</span>
      <button type="button" id="snd" class="chip small" aria-pressed="false">Ton aus</button>
    </div>
    <div class="picks" id="picks"></div>
    <div class="chips">
      <button type="button" id="pourTraining" class="chip">+ Training 8,4 t</button>
      <button type="button" id="pourAll" class="chip">Beintag 38 t</button>
      <button type="button" id="reset" class="chip">Leeren</button>
    </div>
    <p class="status" id="status" aria-live="polite">Tippe eine Scheibe. Sie fällt in die Mitte des Silos.</p>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grab" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle">Bild teilen</h2>
      <button type="button" class="icon-btn" id="sheetClose" aria-label="Schließen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <div class="seg" id="seg">
      <button type="button" data-mode="card" aria-pressed="true">Karte</button>
      <button type="button" data-mode="sticker" aria-pressed="false">Sticker</button>
      <button type="button" data-mode="photo" aria-pressed="false">Auf Foto</button>
    </div>
    <div class="preview" id="preview"><img id="previewImg" alt="Vorschau des Bildes zum Teilen"><p id="previewEmpty" hidden>Wähle ein Foto vom Training. Das Silo kommt als Wasserzeichen unten links darauf.</p></div>
    <div class="row">
      <label class="chip" id="photoPick" hidden>Foto wählen<input type="file" accept="image/*" id="photoInput" class="vh"></label>
      <button type="button" class="cta" id="saveBtn">Bild speichern</button>
    </div>
    <p class="hint" id="saveHint" aria-live="polite"></p>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(() => {
  const M = window.Matter
  const $ = id => document.getElementById(id)
  if (!M) { $('loading').textContent = 'Die Physik-Bibliothek ließ sich nicht laden.'; return }

  const app = $('app'), cv = $('stage'), ctx = cv.getContext('2d')
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
  const deNum = n => n.toLocaleString('de-DE')
  const fmtT = kg => (kg / 1000).toLocaleString('de-DE', { maximumFractionDigits: 1 }) + ' t'

  // ---------- Welt ----------
  // Einheit: 160 = Durchmesser einer 20-kg-Scheibe (45 cm). Das 30-t-Silo ist 3600 breit (~10 m).
  const KINDS = {
    20:   { kg: 20,   w: 160, h: 22 },
    15:   { kg: 15,   w: 144, h: 20 },
    10:   { kg: 10,   w: 127, h: 18 },
    7.5:  { kg: 7.5,  w: 110, h: 16 },
    5:    { kg: 5,    w: 94,  h: 15 },
    2.5:  { kg: 2.5,  w: 78,  h: 14 },
    1.25: { kg: 1.25, w: 63,  h: 14 },
  }
  const ORDER = [20, 15, 10, 7.5, 5, 2.5, 1.25]
  // Das Silo waechst in Stufen mit dem Gewicht. Flaeche ~ Gewicht, also Kanten ~ Wurzel.
  const MAX_CAP = 30000, MAX_W = 3600, MAX_H = 3300, WALL = 140
  const TIERS = [1000, 2500, 5000, 10000, 15000, 20000, 25000, 30000]
  const FILL = 0.78            // ab diesem Fuellgrad waechst das Silo auf die naechste Stufe
  const dims = cap => { const f = Math.sqrt(cap / MAX_CAP); return { w: MAX_W * f, h: MAX_H * f } }
  const tierFor = kg => TIERS.find(t => kg <= t * FILL) || MAX_CAP
  const COL = 30, NCOL = MAX_W / COL, GL = -MAX_W / 2
  const MAXSTEP = 9            // hoechste Bewegung je Teilschritt (gegen Durchtunneln)
  const SOFT = 90, HARD = 260  // aktive Koerper, ab denen der Haufen "einbackt"
  const DEPTH = 150            // so tief unter der Oberflaeche wird eine ruhende Scheibe eingebacken

  const engine = M.Engine.create({ enableSleeping: true, positionIterations: 10, velocityIterations: 8 })
  engine.gravity.y = 2.4
  const world = engine.world
  const WALL_LEN = MAX_H + 3400
  const wallL = M.Bodies.rectangle(0, -WALL_LEN / 2 + 200, WALL, WALL_LEN, { isStatic: true, friction: 0.4 })
  const wallR = M.Bodies.rectangle(0, -WALL_LEN / 2 + 200, WALL, WALL_LEN, { isStatic: true, friction: 0.4 })
  M.Composite.add(world, [M.Bodies.rectangle(0, 200, MAX_W + 2 * WALL + 400, 400, { isStatic: true, friction: 0.9 }), wallL, wallR])

  const silo = { cap: TIERS[0], w: 0, h: 0, from: null, to: null, t0: 0, dur: 950 }
  function setWalls(w) {
    M.Body.setPosition(wallL, { x: -w / 2 - WALL / 2, y: wallL.position.y })
    M.Body.setPosition(wallR, { x: w / 2 + WALL / 2, y: wallR.position.y })
  }
  function setSiloNow(cap) {
    const d = dims(cap)
    silo.cap = cap; silo.w = d.w; silo.h = d.h; silo.from = silo.to = null
    setWalls(d.w)
  }
  const wallT = () => Math.max(44, WALL * silo.w / MAX_W)
  const baseT = () => Math.max(30, 90 * silo.w / MAX_W)

  let live = []          // bewegliche Scheiben
  let baked = []         // eingebackene Scheiben {kg, x, y, a}: Bild + Hoehenprofil
  let silent = false     // beim Vorrechnen kein Staub, kein Ton
  let total = 0, count = 0, siloNo = 1, siloKg = 0
  const colTop = new Float32Array(NCOL)
  const colBodies = new Array(NCOL).fill(null)
  let bakedTop = 0

  const BR = 0.4, BAKE_TOP = MAX_H + 400
  const bake = document.createElement('canvas')
  bake.width = MAX_W * BR; bake.height = BAKE_TOP * BR
  const bctx = bake.getContext('2d')

  // ---------- Scheiben-Grafik (Vektorstil wie die Scheiben-Ansicht) ----------
  const SPR = 1.6
  function rr(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r)
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath()
  }
  function bands(g, stops, x0, y0, x1, y1) {
    const gr = g.createLinearGradient(x0, y0, x1, y1)
    for (const [o, c] of stops) gr.addColorStop(o, c)
    return gr
  }
  function spacing(g, px) { try { g.letterSpacing = px + 'px' } catch (_) {} }
  function makeSprite(k) {
    const c = document.createElement('canvas')
    const W = Math.ceil(k.w * SPR), H = Math.ceil(k.h * SPR), r = H * 0.4
    c.width = W; c.height = H
    const g = c.getContext('2d')
    g.save(); rr(g, 0, 0, W, H, r); g.clip()
    g.fillStyle = bands(g, [[0, '#a3a6ad'], [.12, '#a3a6ad'], [.12, '#2e3035'], [.28, '#2e3035'], [.28, '#5d6168'], [.6, '#5d6168'], [.6, '#27292e'], [.86, '#27292e'], [.86, '#141517'], [1, '#141517']], 0, 0, 0, H)
    g.fillRect(0, 0, W, H)
    g.fillStyle = bands(g, [[0, 'rgba(0,0,0,.55)'], [.06, 'rgba(0,0,0,.55)'], [.06, 'rgba(0,0,0,.2)'], [.2, 'rgba(0,0,0,.2)'], [.2, 'rgba(0,0,0,0)'], [.8, 'rgba(0,0,0,0)'], [.8, 'rgba(0,0,0,.2)'], [.94, 'rgba(0,0,0,.2)'], [.94, 'rgba(0,0,0,.55)'], [1, 'rgba(0,0,0,.55)']], 0, 0, W, 0)
    g.fillRect(0, 0, W, H)
    const label = deNum(k.kg) + ' KG'
    g.font = `700 ${Math.round(H * 0.46)}px "Space Grotesk", Inter, sans-serif`
    g.textAlign = 'center'; g.textBaseline = 'middle'
    spacing(g, (H * 0.07).toFixed(1))
    const ty = H * 0.47
    g.fillStyle = 'rgba(0,0,0,.9)'; g.fillText(label, W / 2, ty + 1)
    g.fillStyle = 'rgba(255,255,255,.25)'; g.fillText(label, W / 2, ty - 1)
    g.fillStyle = '#b8bcc4'; g.fillText(label, W / 2, ty)
    g.restore()
    g.lineWidth = 1.2; g.strokeStyle = 'rgba(0,0,0,.7)'; rr(g, .6, .6, W - 1.2, H - 1.2, r); g.stroke()
    k.spr = c
  }

  // ---------- Physik ----------
  M.Events.on(engine, 'afterUpdate', () => {
    for (const b of live) {
      const dx = b.position.x - b.positionPrev.x, dy = b.position.y - b.positionPrev.y
      const d = Math.hypot(dx, dy)
      if (d > MAXSTEP) { const k = MAXSTEP / d; b.positionPrev.x = b.position.x - dx * k; b.positionPrev.y = b.position.y - dy * k }
    }
  })
  M.Events.on(engine, 'collisionStart', e => {
    for (const p of e.pairs) {
      for (const [a, o] of [[p.bodyA, p.bodyB], [p.bodyB, p.bodyA]]) {
        const t = a.plugin && a.plugin.tyd
        if (!t || !t.fresh) continue
        const ot = o.plugin && o.plugin.tyd
        if (ot && ot.fresh) continue
        t.fresh = false
        if (silent) continue
        const sp = Math.hypot(a.position.x - a.positionPrev.x, a.position.y - a.positionPrev.y)
        if (sp > 2.2) {
          const s = p.collision && p.collision.supports && p.collision.supports[0]
          impact(s ? s.x : a.position.x, s ? s.y : a.position.y + KINDS[t.kg].h / 2, t.kg, sp)
        }
      }
    }
  })

  // Nur liegende Scheiben zaehlen zum Haufen, nicht die gerade fallenden oder springenden.
  const settled = b => !b.plugin.tyd.fresh && (b.isSleeping || b.speed < 0.35)
  function heapTop() {
    let top = bakedTop
    for (const b of live) if (settled(b) && b.bounds.min.y < top) top = b.bounds.min.y
    return top
  }
  function spawnY() {
    const viewTop = -(layout.availH / cam.s)
    const ht = heapTop()
    return Math.min(Math.max(viewTop + 30 / cam.s, ht - 2400), ht - 320)
  }
  function addPlate(kg, x, y, a, fresh) {
    const k = KINDS[kg]
    const b = M.Bodies.rectangle(x, y, k.w, k.h, {
      chamfer: { radius: k.h * 0.35 }, friction: 0.8, frictionStatic: 1.2, restitution: 0.03, frictionAir: 0.004, slop: 0.03,
    })
    M.Body.setMass(b, kg * 0.3 + 2)
    M.Body.setAngle(b, a)
    b.plugin.tyd = { kg, fresh }
    M.Composite.add(world, b)
    live.push(b)
    return b
  }
  function drop(kg, spread) {
    if (siloKg + kg > MAX_CAP + 1e-6) nextSilo()
    let x = (Math.random() - 0.5) * (spread || 16)
    let y = spawnY()
    for (const b of live) if (b.plugin.tyd.fresh && Math.abs(b.position.x - x) < 120 && Math.abs(b.position.y - y) < 46) y = Math.min(y, b.position.y - 46)
    const b = addPlate(kg, x, y, (Math.random() - 0.5) * 0.35, true)
    M.Body.setAngularVelocity(b, (Math.random() - 0.5) * 0.02)
    total += kg; siloKg += kg; count++
    const t = tierFor(siloKg)
    if (t > silo.cap) grow(t)
  }

  // ---------- Wachsen ----------
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2
  function grow(cap) {
    // Scheiben am Rand werden wieder beweglich, damit sie in den neuen Platz rutschen.
    unbakeNearWalls(silo.w)
    for (const b of live) M.Sleeping.set(b, false)
    const d = dims(cap)
    silo.cap = cap
    if (reduce) { silo.w = d.w; silo.h = d.h; silo.from = silo.to = null; setWalls(d.w) }
    else { silo.from = { w: silo.w, h: silo.h }; silo.to = d; silo.t0 = performance.now() }
    notice(`Das Silo wächst auf ${fmtT(cap)}.`)
  }
  function stepSilo(now) {
    if (!silo.to) return
    const k = Math.min(1, (now - silo.t0) / silo.dur), e = ease(k)
    silo.w = silo.from.w + (silo.to.w - silo.from.w) * e
    silo.h = silo.from.h + (silo.to.h - silo.from.h) * e
    setWalls(silo.w)
    for (const b of live) if (b.isSleeping && Math.abs(b.position.x) > silo.w / 2 - 340) M.Sleeping.set(b, false)
    if (k >= 1) silo.from = silo.to = null
  }
  // Was beim Wegfahren der Wand abrutschen wuerde: ein Keil, der unten an der Wand beginnt
  // und nach oben breiter wird (etwa 60 Grad). Darunter bleibt der Haufen fest.
  const UNBAKE_MAX = 700
  function unbakeNearWalls(w) {
    const keep = [], back = []
    for (const e of baked) (Math.abs(e.x) > w / 2 - 160 - 0.58 * -e.y ? back : keep).push(e)
    if (!back.length) return
    if (back.length > UNBAKE_MAX) {
      back.sort((a, b) => a.y - b.y)          // die obersten zuerst, die tiefsten bleiben fest
      keep.push(...back.splice(UNBAKE_MAX))
    }
    baked = keep
    rebuildBake()
    for (const e of back) addPlate(e.kg, e.x, e.y, e.a, false)
  }

  // ---------- Einbacken ----------
  function corners(e) {
    const k = KINDS[e.kg], c = Math.cos(e.a), s = Math.sin(e.a), hw = k.w / 2, hh = k.h / 2
    return [[-hw, -hh], [hw, -hh], [hw, hh], [-hw, hh]].map(([x, y]) => ({ x: e.x + x * c - y * s, y: e.y + x * s + y * c }))
  }
  function topAt(v, x) {
    let best = Infinity
    for (let j = 0; j < v.length; j++) {
      const a = v[j], c = v[(j + 1) % v.length]
      if ((a.x <= x && c.x >= x) || (c.x <= x && a.x >= x)) {
        const y = a.x === c.x ? Math.min(a.y, c.y) : a.y + (c.y - a.y) * (x - a.x) / (c.x - a.x)
        if (y < best) best = y
      }
    }
    return best
  }
  const dirty = new Set()
  function profile(e) {
    const v = corners(e)
    let mn = Infinity, mx = -Infinity
    for (const p of v) { if (p.x < mn) mn = p.x; if (p.x > mx) mx = p.x }
    const i0 = Math.max(0, Math.floor((mn - GL) / COL)), i1 = Math.min(NCOL - 1, Math.floor((mx - GL) / COL))
    for (let i = i0; i <= i1; i++) {
      const xl = GL + i * COL
      let top = Infinity
      for (const sx of [xl + 3, xl + COL / 2, xl + COL - 3]) { const y = topAt(v, sx); if (y < top) top = y }
      if (top < colTop[i]) { colTop[i] = top; dirty.add(i) }
    }
  }
  function paintBaked(e) {
    const k = KINDS[e.kg]
    bctx.save()
    bctx.translate((e.x - GL) * BR, (e.y + BAKE_TOP) * BR)
    bctx.rotate(e.a)
    bctx.drawImage(k.spr, -k.w / 2 * BR, -k.h / 2 * BR, k.w * BR, k.h * BR)
    bctx.restore()
  }
  function setColumn(i) {
    if (colBodies[i]) { M.Composite.remove(world, colBodies[i]); colBodies[i] = null }
    if (colTop[i] < -0.5) {
      const h = -colTop[i] + 200
      colBodies[i] = M.Bodies.rectangle(GL + (i + 0.5) * COL, colTop[i] + h / 2, COL, h, { isStatic: true, friction: 0.8 })
      M.Composite.add(world, colBodies[i])
    }
  }
  function flushColumns() {
    for (const i of dirty) setColumn(i)
    dirty.clear()
    bakedTop = 0
    for (let i = 0; i < NCOL; i++) if (colTop[i] < bakedTop) bakedTop = colTop[i]
  }
  function rebuildBake() {
    bctx.clearRect(0, 0, bake.width, bake.height)
    colTop.fill(0)
    for (let i = 0; i < NCOL; i++) dirty.add(i)
    for (const e of baked) { paintBaked(e); profile(e) }
    flushColumns()
  }
  function bakeBody(b) {
    const e = { kg: b.plugin.tyd.kg, x: b.position.x, y: b.position.y, a: b.angle }
    baked.push(e); paintBaked(e); profile(e)
    M.Composite.remove(world, b)
  }
  const span = b => [Math.max(0, Math.floor((b.bounds.min.x - GL) / COL)), Math.min(NCOL - 1, Math.floor((b.bounds.max.x - GL) / COL))]
  function bakePass() {
    const n = live.length
    if (n <= SOFT || silo.to) return
    const surf = Float32Array.from(colTop)
    for (const b of live) {
      if (!settled(b)) continue
      const [i0, i1] = span(b)
      for (let i = i0; i <= i1; i++) if (b.bounds.min.y < surf[i]) surf[i] = b.bounds.min.y
    }
    const depth = n > HARD ? DEPTH * 0.4 : DEPTH
    const gone = new Set()
    for (const c of live) {
      if (!settled(c)) continue
      if (!c.isSleeping && n <= HARD) continue
      const [i0, i1] = span(c)
      let top = Infinity
      for (let i = i0; i <= i1; i++) if (surf[i] < top) top = surf[i]
      if (c.bounds.min.y - top < depth) continue
      bakeBody(c); gone.add(c)
      if (gone.size >= 60) break
    }
    if (gone.size) { live = live.filter(b => !gone.has(b)); flushColumns() }
  }
  function clearHeap() {
    for (const b of live) M.Composite.remove(world, b)
    live = []; baked = []; dust.length = 0; siloKg = 0
    rebuildBake()
    setSiloNow(TIERS[0])
    cam.snap = true
  }

  // ---------- Kamera + Layout ----------
  const layout = { W: 0, H: 0, dpr: 1, hudB: 0, floorY: 0, availH: 0 }
  const cam = { s: 0.4, snap: true }
  let bg = null, vig = null
  function resize() {
    const r = app.getBoundingClientRect()
    layout.W = r.width; layout.H = r.height
    layout.dpr = Math.min(2, window.devicePixelRatio || 1)
    cv.width = Math.round(r.width * layout.dpr); cv.height = Math.round(r.height * layout.dpr)
    layout.hudB = $('hud').getBoundingClientRect().bottom - r.top + 18
    layout.floorY = $('tray').getBoundingClientRect().top - r.top - 4
    layout.availH = Math.max(120, layout.floorY - layout.hudB)
    bg = document.createElement('canvas'); bg.width = cv.width; bg.height = cv.height
    const g = bg.getContext('2d'); g.scale(layout.dpr, layout.dpr)
    paintStage(g, layout.W, layout.H)
    vig = document.createElement('canvas'); vig.width = cv.width; vig.height = cv.height
    const v = vig.getContext('2d'); v.scale(layout.dpr, layout.dpr)
    paintVignette(v, layout.W, layout.H)
    cam.snap = true
  }
  function paintStage(g, W, H) {
    g.fillStyle = '#030308'; g.fillRect(0, 0, W, H)
    const gr = g.createRadialGradient(W / 2, -20, 10, W / 2, -20, H * 0.75)
    gr.addColorStop(0, 'rgba(255,243,224,.20)'); gr.addColorStop(.45, 'rgba(255,243,224,.05)'); gr.addColorStop(1, 'rgba(255,243,224,0)')
    g.fillStyle = gr; g.fillRect(0, 0, W, H)
  }
  function paintVignette(g, W, H) {
    const gr = g.createRadialGradient(W / 2, H * 0.45, H * 0.3, W / 2, H * 0.45, H * 0.8)
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.6)')
    g.fillStyle = gr; g.fillRect(0, 0, W, H)
  }
  // Die Kamera rahmt immer das ganze Silo: so ist jedes Bild davon teilbar.
  function siloFit(rw, rh) { return Math.min(rw / (silo.w + 2 * wallT() + 16), rh / (silo.h + 50 + baseT())) }
  function updateCamera() {
    const t = Math.min(0.62, siloFit(layout.W - 28, layout.availH - 16))
    if (cam.snap || reduce) { cam.s = t; cam.snap = false } else cam.s += (t - cam.s) * 0.14
  }

  // ---------- Kreide + Ton ----------
  const dust = []
  let lastDust = 0, lastSound = 0
  function impact(wx, wy, kg, sp) {
    const now = performance.now()
    if (!reduce && now - lastDust > (pouring ? 70 : 0) && dust.length < 320) {
      lastDust = now
      const k = Math.max(0.35, Math.min(1, cam.s / 0.56)), size = 0.5 + kg / 40
      const n = Math.round((10 + 12 * kg / 20) * (pouring ? 0.5 : 1))
      for (let i = 0; i < n; i++) {
        const dir = Math.random() < 0.5 ? -1 : 1
        dust.push({ wx, wy, dx: 0, dy: 0, vx: dir * (0.6 + Math.random() * 2.6) * k * (1 + size), vy: -(Math.random() * 1.1) * k, life: 0, max: 36 + Math.random() * 26, r: (1 + Math.random() * 2) * k * (0.8 + size * 0.5), cloud: false })
      }
      for (let i = 0; i < (pouring ? 1 : 2); i++) dust.push({ wx, wy, dx: (i ? 1 : -1) * 6 * k, dy: -4 * k, vx: (i ? 1 : -1) * 0.5 * k, vy: -0.15, life: 0, max: 44, r: 16 * k * (0.8 + size), cloud: true, a: pouring ? 0.14 : 0.38 })
    }
    if (soundOn && now - lastSound > 45) { lastSound = now; clank(Math.min(1, sp / MAXSTEP), kg) }
    try { if (!pouring && navigator.vibrate && navigator.userActivation && navigator.userActivation.hasBeenActive) navigator.vibrate(12) } catch (_) {}
  }
  let actx = null, noise = null, soundOn = false
  function ensureAudio() {
    if (actx) return
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)()
      noise = actx.createBuffer(1, actx.sampleRate * 0.25, actx.sampleRate)
      const d = noise.getChannelData(0)
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3)
    } catch (_) { actx = null }
  }
  function clank(v, kg) {
    if (!actx) return
    const t = actx.currentTime, heavy = kg / 20, q = pouring ? 0.4 : 1
    const src = actx.createBufferSource(); src.buffer = noise
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500 - 700 * heavy; bp.Q.value = 3
    const g = actx.createGain(); g.gain.setValueAtTime(0.25 * v * q, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.22)
    src.connect(bp).connect(g).connect(actx.destination); src.start(t); src.stop(t + 0.25)
    const o = actx.createOscillator(); o.type = 'triangle'; o.frequency.setValueAtTime(260 - 120 * heavy, t); o.frequency.exponentialRampToValueAtTime(90, t + 0.12)
    const og = actx.createGain(); og.gain.setValueAtTime(0.18 * v * q, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.14)
    o.connect(og).connect(actx.destination); o.start(t); o.stop(t + 0.15)
  }

  // ---------- Silo zeichnen (Bildschirm und Export) ----------
  // k = Pixel je Welteinheit, (tx, ty) = Bildpunkt der Bodenmitte. crisp: jede Scheibe einzeln statt Bitmap.
  function steel(g, x, y, w, h, vertical) {
    g.fillStyle = bands(g, [[0, '#1a1d24'], [.18, '#3c424e'], [.5, '#4d5361'], [.82, '#2b2f38'], [1, '#121419']], x, y, vertical ? x + w : x, vertical ? y : y + h)
    g.fillRect(x, y, w, h)
  }
  function plate(g, k, tx, ty, kg, x, y, a) {
    const K = KINDS[kg], c = Math.cos(a), s = Math.sin(a)
    g.setTransform(k * c, k * s, -k * s, k * c, tx + x * k, ty + y * k)
    g.drawImage(K.spr, -K.w / 2, -K.h / 2, K.w, K.h)
  }
  function drawSilo(g, k, tx, ty, crisp) {
    const w = silo.w, h = silo.h, L = -w / 2, R = w / 2, wt = wallT(), bt = baseT(), f = w / MAX_W
    g.setTransform(k, 0, 0, k, tx, ty)
    g.fillStyle = bands(g, [[0, '#0d0f18'], [1, '#15172a']], 0, -h, 0, 0)
    g.fillRect(L, -h, w, h)
    g.strokeStyle = 'rgba(255,255,255,.035)'; g.lineWidth = Math.max(3, 6 * f)
    for (let i = 1; i < 5; i++) { const y = -h * i / 5; g.beginPath(); g.moveTo(L, y); g.lineTo(R, y); g.stroke() }
    for (let i = 1; i < 4; i++) { const x = L + w * i / 4; g.beginPath(); g.moveTo(x, -h); g.lineTo(x, 0); g.stroke() }
    g.fillStyle = 'rgba(239,233,221,.07)'; g.font = `700 ${Math.round(w * 0.07)}px "Space Grotesk", Inter, sans-serif`
    g.textAlign = 'center'; g.textBaseline = 'middle'; spacing(g, 0)
    g.fillText('MAX ' + fmtT(silo.cap).toUpperCase(), 0, -h + w * 0.085)

    if (crisp) for (const e of baked) plate(g, k, tx, ty, e.kg, e.x, e.y, e.a)
    else { g.drawImage(bake, GL, -BAKE_TOP, MAX_W, BAKE_TOP) }
    for (const b of live) plate(g, k, tx, ty, b.plugin.tyd.kg, b.position.x, b.position.y, b.angle)

    g.setTransform(k, 0, 0, k, tx, ty)
    const top = heapTop()
    if (top < 0) {
      g.fillStyle = bands(g, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,.42)']], 0, top, 0, 0)
      g.fillRect(L, top, w, -top)
    }
    const spot = g.createRadialGradient(0, top, 10, 0, top, w * 0.45)
    spot.addColorStop(0, 'rgba(255,236,205,.09)'); spot.addColorStop(1, 'rgba(255,236,205,0)')
    g.fillStyle = spot; g.fillRect(L, top - w * 0.45, w, w * 0.9)

    steel(g, L - wt, -h, wt, h + bt, true)
    steel(g, R, -h, wt, h + bt, true)
    steel(g, L - wt, 0, w + 2 * wt, bt, false)
    const rim = Math.max(10, 24 * f)
    g.fillStyle = 'rgba(255,240,220,.35)'
    g.fillRect(L - wt - rim * 0.4, -h - rim, wt + rim * 0.8, rim); g.fillRect(R - rim * 0.4, -h - rim, wt + rim * 0.8, rim)
    g.fillStyle = 'rgba(255,240,220,.12)'; g.fillRect(L - 4, -h, 4, h); g.fillRect(R, -h, 4, h)
    if (wt * k > 9) {
      g.fillStyle = 'rgba(0,0,0,.55)'
      const step = Math.max(160, h / 10)
      for (let y = -step * 0.8; y > -h; y -= step) for (const x of [L - wt / 2, R + wt / 2]) { g.beginPath(); g.arc(x, y, wt * 0.11, 0, 7); g.fill() }
    }
  }
  function draw() {
    const { W, H, dpr, floorY } = layout, s = cam.s
    ctx.setTransform(1, 0, 0, 1, 0, 0)
    ctx.drawImage(bg, 0, 0)
    drawSilo(ctx, dpr * s, dpr * W / 2, dpr * floorY, false)

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    const gy = floorY + baseT() * s
    ctx.fillStyle = bands(ctx, [[0, '#0c0d17'], [1, '#05060c']], 0, gy, 0, H)
    ctx.fillRect(0, gy, W, H - gy)
    ctx.fillStyle = bands(ctx, [[0, 'rgba(255,236,205,0)'], [.5, 'rgba(255,236,205,.22)'], [1, 'rgba(255,236,205,0)']], 0, 0, W, 0)
    ctx.fillRect(0, gy, W, 1)

    for (let i = dust.length - 1; i >= 0; i--) {
      const p = dust[i]
      p.life++; p.dx += p.vx; p.dy += p.vy; p.vx *= p.cloud ? 0.97 : 0.93; p.vy = p.vy * 0.95 + (p.cloud ? -0.01 : 0.02)
      const k = p.life / p.max
      if (k >= 1) { dust.splice(i, 1); continue }
      const x = W / 2 + p.wx * s + p.dx, y = floorY + p.wy * s + p.dy
      if (p.cloud) {
        const r = p.r * (0.6 + 1.8 * (1 - Math.pow(1 - k, 3)))
        const gr = ctx.createRadialGradient(x, y, 0, x, y, r)
        gr.addColorStop(0, `rgba(239,233,221,${p.a * (1 - k)})`); gr.addColorStop(1, 'rgba(239,233,221,0)')
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill()
      } else {
        ctx.fillStyle = `rgba(239,233,221,${0.9 * (1 - k)})`
        ctx.beginPath(); ctx.arc(x, y, p.r * (0.6 + k), 0, 7); ctx.fill()
      }
    }
    // Band unter der Zahl: Neue Scheiben tauchen weich aus dem Dunkel auf.
    ctx.setTransform(1, 0, 0, 1, 0, 0)
    const hb = Math.round(layout.hudB * dpr), band = Math.round(36 * dpr)
    ctx.drawImage(bg, 0, 0, bg.width, Math.max(1, hb - band), 0, 0, bg.width, Math.max(1, hb - band))
    for (let i = 0; i < 12; i++) {
      const y0 = hb - band + Math.round(i * band / 12), h = Math.ceil(band / 12)
      ctx.globalAlpha = 1 - i / 12
      ctx.drawImage(bg, 0, y0, bg.width, h, 0, y0, bg.width, h)
    }
    ctx.globalAlpha = 1
    ctx.drawImage(vig, 0, 0)
  }

  // ---------- HUD ----------
  let shown = 0, noticeUntil = 0
  const elKg = $('kg'), elBar = $('bar'), elPct = $('pct'), elStatus = $('status')
  function notice(msg) { elStatus.textContent = msg; noticeUntil = performance.now() + 2200 }
  function hud(force) {
    const d = total - shown
    shown = force || reduce || Math.abs(d) < 0.5 ? total : shown + d * 0.18
    elKg.textContent = deNum(Math.round(shown))
    const pct = Math.min(100, siloKg / silo.cap * 100)
    elBar.style.width = pct.toFixed(2) + '%'
    elPct.textContent = `${siloNo > 1 ? 'Silo ' + siloNo + ' · ' : ''}${fmtT(silo.cap).replace(' ', '-')}-Silo · ${pct.toLocaleString('de-DE', { maximumFractionDigits: 0 })} % · ${deNum(count)} Scheiben`
  }

  // ---------- Einfuellen ----------
  let queue = [], pouring = false, pourAcc = 0, pourRate = 14, pourLabel = ''
  const PATTERN = [20, 20, 20, 15, 20, 10, 20, 5, 20, 2.5, 20, 1.25, 20, 7.5, 10, 20]
  function plan(kg) {
    const out = []
    let rest = kg, i = 0
    while (rest >= 20) { const p = PATTERN[i++ % PATTERN.length]; out.push(p); rest -= p }
    for (const p of ORDER) while (rest >= p - 1e-9) { out.push(p); rest -= p }
    return out
  }
  function startPour(kg, rate, label) {
    queue = plan(kg); pourRate = rate; pouring = true; pourAcc = 1; pourLabel = label
    syncButtons()
  }
  function stopPour(msg) {
    queue = []; pouring = false; syncButtons()
    if (msg) elStatus.textContent = msg
  }
  function pourTick(dt) {
    if (!pouring) return
    pourAcc += dt * pourRate / 1000
    while (pourAcc >= 1 && queue.length) { drop(queue.shift(), 60); pourAcc-- }
    if (performance.now() > noticeUntil) elStatus.textContent = `${pourLabel} · noch ${deNum(queue.length)} Scheiben`
    if (!queue.length) stopPour(siloNo > 1 ? `Eingefüllt. Das Training hat ${siloNo} Silos gebraucht.` : 'Eingefüllt.')
  }
  function nextSilo() {
    clearHeap()
    siloNo++
    notice(`Silo ${siloNo - 1} ist voll (30 t). Silo ${siloNo} beginnt.`)
  }
  function syncButtons() {
    $('pourAll').textContent = pouring ? 'Stopp' : 'Beintag 38 t'
    $('pourAll').classList.toggle('on', pouring)
    $('pourTraining').disabled = pouring
  }

  // ---------- Bedienung ----------
  for (const kg of ORDER) {
    const k = KINDS[kg]
    const b = document.createElement('button')
    b.type = 'button'; b.className = 'pick'; b.id = 'pick-' + String(kg).replace('.', '-')
    b.setAttribute('aria-label', `${deNum(kg)}-kg-Scheibe einwerfen`)
    b.innerHTML = `<span class="slab" style="--w:${Math.round(k.w / 160 * 100)}%;--h:${Math.round(k.h / 22 * 16)}px"></span><span class="lab">${deNum(kg)}</span>`
    b.addEventListener('click', () => { drop(kg); if (performance.now() > noticeUntil) elStatus.textContent = `${deNum(kg)} kg eingeworfen.` })
    $('picks').append(b)
  }
  $('pourTraining').addEventListener('click', () => startPour(8420, 16, 'Training: 8.420 kg'))
  $('pourAll').addEventListener('click', () => pouring ? stopPour('Angehalten.') : startPour(38000, 34, 'Extremer Beintag: 38.000 kg'))
  $('reset').addEventListener('click', () => {
    stopPour('Silo geleert.')
    clearHeap(); siloNo = 1; total = 0; count = 0; hud(true)
  })
  $('snd').addEventListener('click', e => {
    soundOn = !soundOn
    if (soundOn) { ensureAudio(); try { actx && actx.resume() } catch (_) {} }
    e.currentTarget.textContent = soundOn ? 'Ton an' : 'Ton aus'
    e.currentTarget.classList.toggle('on', soundOn)
    e.currentTarget.setAttribute('aria-pressed', String(soundOn))
  })
  window.addEventListener('resize', resize)

  // ---------- Teilen: Karte, Sticker, auf Foto ----------
  const today = new Date()
  const dateText = today.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' })
  const isoDate = today.toISOString().slice(0, 10)
  function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c }
  function paintSiloInto(g, rx, ry, rw, rh) {
    const s = siloFit(rw, rh)
    drawSilo(g, s, rx + rw / 2, ry + rh - baseT() * s, true)
    g.setTransform(1, 0, 0, 1, 0, 0)
  }
  function text(g, str, x, y, font, color, align, ls) {
    g.font = font; g.fillStyle = color; g.textAlign = align || 'left'; g.textBaseline = 'alphabetic'; spacing(g, ls || 0)
    g.fillText(str, x, y)
  }
  // Zahl + "kg" als eine Zeile, mittig oder linksbuendig
  function bigNumber(g, x, y, size, align, shadow) {
    const num = deNum(Math.round(total)), unit = ' kg'
    g.font = `700 ${size}px "Space Grotesk", Inter, sans-serif`; spacing(g, -size * 0.03)
    const nw = g.measureText(num).width
    g.font = `700 ${Math.round(size * 0.36)}px Inter, sans-serif`; spacing(g, 0)
    const uw = g.measureText(unit).width
    const x0 = align === 'center' ? x - (nw + uw) / 2 : x
    if (shadow) { g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 28; g.shadowOffsetY = 4 }
    text(g, num, x0, y, `700 ${size}px "Space Grotesk", Inter, sans-serif`, '#fff7ed', 'left', -size * 0.03)
    text(g, unit, x0 + nw, y, `700 ${Math.round(size * 0.36)}px Inter, sans-serif`, shadow ? 'rgba(255,255,255,.82)' : '#8e99b5', 'left')
  }
  const subLine = () => `${deNum(count)} Hantelscheiben${siloNo > 1 ? ' · ' + siloNo + ' Silos' : ''} · ${dateText}`

  function renderCard() {
    const W = 1080, H = 1350, c = canvas(W, H), g = c.getContext('2d')
    paintStage(g, W, H)
    text(g, 'TRAININGSVOLUMEN', 72, 120, '600 30px Inter, sans-serif', '#8e99b5', 'left', 4)
    bigNumber(g, 68, 270, 150, 'left', false)
    text(g, subLine(), 72, 330, '500 30px Inter, sans-serif', '#5d6680', 'left')
    paintSiloInto(g, 60, 390, 960, 830)
    paintVignette(g, W, H)
    g.fillStyle = 'rgba(255,236,205,.18)'; g.fillRect(72, 1258, W - 144, 1)
    text(g, 'TrackYourDose', 72, 1306, '700 30px "Space Grotesk", Inter, sans-serif', '#c7cfe2', 'left', 1)
    text(g, `${fmtT(silo.cap)}-Silo`, W - 72, 1306, '500 28px Inter, sans-serif', '#5d6680', 'right')
    return c
  }
  function renderSticker() {
    const W = 1080, H = 1240, c = canvas(W, H), g = c.getContext('2d')
    g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 20; g.shadowOffsetY = 3
    text(g, 'TRAININGSVOLUMEN', W / 2, 74, '600 32px Inter, sans-serif', 'rgba(255,255,255,.86)', 'center', 4)
    bigNumber(g, W / 2, 240, 168, 'center', true)
    g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 20; g.shadowOffsetY = 3
    text(g, subLine(), W / 2, 300, '500 32px Inter, sans-serif', 'rgba(255,255,255,.8)', 'center')
    g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0
    paintSiloInto(g, 70, 330, 940, 820)
    g.shadowColor = 'rgba(0,0,0,.55)'; g.shadowBlur = 16; g.shadowOffsetY = 2
    text(g, 'TrackYourDose', W / 2, 1214, '700 34px "Space Grotesk", Inter, sans-serif', 'rgba(255,255,255,.9)', 'center', 1)
    g.shadowColor = 'transparent'
    return c
  }
  function renderOnPhoto(img) {
    const W = 1080, H = 1350, c = canvas(W, H), g = c.getContext('2d')
    const sc = Math.max(W / img.width, H / img.height)
    const iw = img.width * sc, ih = img.height * sc
    g.drawImage(img, (W - iw) / 2, (H - ih) / 2, iw, ih)
    const gr = g.createLinearGradient(0, H * 0.5, 0, H)
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.55)')
    g.fillStyle = gr; g.fillRect(0, H * 0.5, W, H * 0.5)
    const st = renderSticker(), sw = 470, sh = sw * st.height / st.width
    g.drawImage(st, 44, H - 36 - sh, sw, sh)
    return c
  }

  let mode = 'card', photo = null, blob = null, blobUrl = null, dl = null, dlChecked = false
  const sheet = $('sheet'), scrim = $('scrim'), img = $('previewImg'), empty = $('previewEmpty'), saveBtn = $('saveBtn'), hint = $('saveHint')
  ;(async () => {
    try { if (window.claude && typeof window.claude.use === 'function') dl = await window.claude.use('downloads') } catch (_) { dl = null }
    dlChecked = true; syncSave()
  })()
  function syncSave() {
    const ready = !!blob
    saveBtn.hidden = !dl
    saveBtn.disabled = !ready
    if (!dl && dlChecked) hint.textContent = ready ? 'Halte das Bild gedrückt, um es zu sichern.' : ''
  }
  async function renderPreview() {
    $('preview').classList.toggle('checker', mode === 'sticker')
    $('photoPick').hidden = mode !== 'photo'
    if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null }
    blob = null
    if (mode === 'photo' && !photo) { img.hidden = true; empty.hidden = false; hint.textContent = ''; syncSave(); return }
    const c = mode === 'card' ? renderCard() : mode === 'sticker' ? renderSticker() : renderOnPhoto(photo)
    const type = mode === 'photo' ? 'image/jpeg' : 'image/png'
    blob = await new Promise(r => c.toBlob(r, type, 0.92))
    blobUrl = URL.createObjectURL(blob)
    img.src = blobUrl; img.hidden = false; empty.hidden = true
    if (dl) hint.textContent = mode === 'sticker' ? 'Durchsichtiger Hintergrund: in der Story über dein Foto legen.' : ''
    syncSave()
  }
  let lastFocus = null
  function openSheet() {
    lastFocus = document.activeElement
    scrim.hidden = false; sheet.hidden = false
    requestAnimationFrame(() => { scrim.classList.add('open'); sheet.classList.add('open') })
    renderPreview()
    $('sheetClose').focus()
  }
  function closeSheet() {
    scrim.classList.remove('open'); sheet.classList.remove('open')
    setTimeout(() => { scrim.hidden = true; sheet.hidden = true }, reduce ? 180 : 320)
    if (lastFocus) lastFocus.focus()
  }
  $('shareBtn').addEventListener('click', openSheet)
  $('sheetClose').addEventListener('click', closeSheet)
  scrim.addEventListener('click', closeSheet)
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) closeSheet() })
  for (const b of $('seg').querySelectorAll('button')) b.addEventListener('click', () => {
    mode = b.dataset.mode
    for (const o of $('seg').querySelectorAll('button')) o.setAttribute('aria-pressed', String(o === b))
    renderPreview()
  })
  $('photoInput').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]
    if (!f) return
    const url = URL.createObjectURL(f), im = new Image()
    im.onload = () => { photo = im; renderPreview() }
    im.onerror = () => { hint.textContent = 'Dieses Bild ließ sich nicht öffnen. Versuche ein JPG oder PNG.' }
    im.src = url
  })
  saveBtn.addEventListener('click', async () => {
    if (!dl || !blob) return
    const name = `tyd-volumen-${isoDate}-${mode === 'card' ? 'karte' : mode === 'sticker' ? 'sticker' : 'foto'}.${mode === 'photo' ? 'jpg' : 'png'}`
    try {
      await dl.save({ filename: name, data: blob })
      hint.textContent = 'Gespeichert.'
    } catch (err) {
      const code = err && err.code
      if (code === 'declined') hint.textContent = 'Nicht gespeichert.'
      else if (code === 'rate_limited') hint.textContent = 'Einen Moment, dann noch einmal.'
      else if (code === 'too_large') hint.textContent = 'Das Bild ist zu groß. Wähle ein kleineres Foto.'
      else { dl = null; syncSave() }
    }
  })

  // ---------- Start ----------
  let last = 0, acc = 0, frames = 0
  function frame(now) {
    const dt = Math.min(50, now - last); last = now
    stepSilo(now)
    const sub = live.length > 320 ? 1000 / 120 : 1000 / 240
    acc += dt
    let n = 0
    while (acc >= sub && n < 10) { M.Engine.update(engine, sub); acc -= sub; n++ }
    if (n === 10) acc = 0
    pourTick(dt)
    if (++frames % 6 === 0) bakePass()
    updateCamera()
    draw(); hud(false)
    requestAnimationFrame(frame)
  }
  // Beispiel: ein erstes Training liegt schon drin (vorab durchgerechnet).
  function presim() {
    silent = true
    for (const kg of plan(640)) {
      drop(kg, 10)
      for (let i = 0; i < 12; i++) M.Engine.update(engine, 1000 / 240)
    }
    for (let i = 0; i < 700; i++) M.Engine.update(engine, 1000 / 240)
    for (const b of live) b.plugin.tyd.fresh = false
    silent = false
    cam.snap = true
  }
  const fontsReady = document.fonts && document.fonts.load ? Promise.race([
    Promise.all([document.fonts.load('700 16px "Space Grotesk"'), document.fonts.load('700 16px Inter'), document.fonts.load('600 16px Inter'), document.fonts.load('500 16px Inter')]),
    new Promise(r => setTimeout(r, 1500)),
  ]) : Promise.resolve()
  fontsReady.catch(() => {}).then(() => {
    for (const kg of ORDER) makeSprite(KINDS[kg])
    setSiloNow(TIERS[0])
    resize()
    updateCamera()
    presim()
    updateCamera()
    hud(true)
    $('loading').hidden = true
    last = performance.now()
    requestAnimationFrame(frame)
  })
})()
</script>
