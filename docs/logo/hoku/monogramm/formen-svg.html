<!doctype html><meta charset="utf-8"><body style="margin:0">
<script src="monogramm.js"></script>
<script>
// Pupillenform als Schwarz-Weiß-Bild (Maske des Abstandsfelds), für Prüfbögen
window.formBild = (m, S) => { const f = monogrammFeld(m, 1024), c = document.createElement('canvas'); c.width = c.height = 1024
  const x = c.getContext('2d'), d = x.createImageData(1024, 1024)
  for (let i = 0; i < 1024 * 1024; i++) { const v = f.innen[i] ? 0 : 255; d.data[i * 4] = d.data[i * 4 + 1] = d.data[i * 4 + 2] = v; d.data[i * 4 + 3] = 255 }
  x.putImageData(d, 0, 0); return c.toDataURL('image/png') }
</script>
