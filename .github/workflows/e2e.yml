name: Gerätetests

# Release-Pruefung: Unit-Tests, Lint, Produktionsbuild und Browser-Journeys
# in Chromium und WebKit mit Geraete-Emulation gegen nachgebildetes Supabase.
# Siehe playwright.config.ts und e2e/. Keine Geheimnisse noetig.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # Fest auf 24.04: ubuntu-latest ist inzwischen 26.04, und dort installiert
    # Playwright 1.56 keine Browser („does not support chromium").
    runs-on: ubuntu-24.04
    # Die Läufe brauchen inzwischen 38–44 Minuten; 45 war zu knapp.
    timeout-minutes: 60
    env:
      VITE_SENTRY_DSN: ''
      SENTRY_AUTH_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Vollständige Unit-Tests
        run: npm test -- --maxWorkers=2
      - name: Lint
        run: npm run lint
      - name: Produktionsbuild mit TypeScript und Prerendering
        run: npm run build
      - name: TypeScript für Browser-Tests
        run: npm run test:e2e:typecheck
      - name: Chromium und WebKit für Playwright
        run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Browser-Bericht und Fehlerartefakte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
